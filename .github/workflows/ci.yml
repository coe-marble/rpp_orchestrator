name: Python tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/coe-marble/rpp-test-container:lyrical-ubuntu26.04-capnp1.1.0-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.RPP_CI_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository under test
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out RPP integration dependencies
        uses: actions/checkout@v4
        with:
          repository: coe-marble/rpp_dev
          ref: develop
          path: rpp_dev
          submodules: recursive
          token: ${{ secrets.RPP_CI_TOKEN || github.token }}
      - name: Overlay the repository under test
        run: rsync -a --delete --exclude=.git candidate/ rpp_dev/src/rpp_orchestrator/
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          for package in rpp_dev/src/rpp_common rpp_dev/src/rpp_plugin_registrator rpp_dev/src/rpp_orchestrator rpp_dev/src/rpp_py rpp_dev/src/rpp_cli rpp_dev/src/rpp_testing; do
            python -m pip install --no-deps -e "$package"
          done
          python -m pip install -e "rpp_dev/src/rpp_orchestrator[test]"
      - name: Run tests
        run: python -m pytest rpp_dev/src/rpp_orchestrator/tests
