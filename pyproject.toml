[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rpp-orchestrator"
dynamic = ["version"]
description = "RPP orchestration and workspace management"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4,<7",
    "rpp-common>=0.2,<0.3",
    "rpp-plugin-registrator>=0.2,<0.3",
    "rpp-py>=0.2,<0.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rpp-orchestrator = "rpp_orchestrator.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "rpp_orchestrator.__version__"}

[tool.setuptools.packages.find]
include = ["rpp_orchestrator", "rpp_orchestrator.*"]
